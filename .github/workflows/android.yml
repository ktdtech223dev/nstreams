name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      # Re-run only when Android-relevant files change
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/android.yml'
    tags:
      - 'v*.*.*'   # also build + publish on every version tag
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node 22 ─────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Java 21 (required by Gradle) ─────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── Android SDK ──────────────────────────────────────────────────────────
      - uses: android-actions/setup-android@v3

      # ── Install npm dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── Build Vite for Android (bakes in Railway API URL + version) ─────────
      - name: Build web (Android target)
        run: npm run build
        env:
          VITE_PLATFORM: android
          VITE_API_URL: https://nstreams-api-production.up.railway.app/api

      # ── Sync into Android project ────────────────────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── Release signing key ──────────────────────────────────────────────────
      # Installed copies only accept updates signed by the SAME key, so this
      # must be the one permanent key — never a per-run debug keystore (which
      # is what every APK before v1.3.10 was signed with).
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret missing — refusing to build an APK installed apps can't update to"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nstreams-release.jks"

      # ── Build signed release APK ─────────────────────────────────────────────
      - name: Build release APK
        env:
          NSTREAMS_KEYSTORE: ${{ runner.temp }}/nstreams-release.jks
          NSTREAMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSTREAMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSTREAMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ── Guard: signer + ABI ──────────────────────────────────────────────────
      # A wrong signer would silently strand every installed copy (updates
      # rejected forever), so fail the build instead. The ABI check protects
      # 32-bit-only devices like the RK3566 projector (armeabi-v7a only).
      - name: Verify APK signer and ABIs
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' signer.txt | awk '{print $NF}')
          WANT=$(tr -d '[:space:]' < android/release-cert.sha256)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::APK signer $GOT does not match android/release-cert.sha256 ($WANT)"
            exit 1
          fi
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/' && ! unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then
            echo "::error::APK ships arm64-only native libs — 32-bit Android devices can't install it"
            exit 1
          fi
          echo "signer + ABI OK"

      # ── Upload APK as workflow artifact (every build) ────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: N-Streams-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── On version tags: rename APK and attach to GitHub Release ─────────────
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "N-Streams-${{ github.ref_name }}-android.apk"

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: N-Streams-${{ github.ref_name }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
